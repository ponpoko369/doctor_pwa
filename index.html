<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563EB">
    <title>의사용 예약 현황</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <h1>예약 현황</h1>
            <p class="subtitle" id="cutoff-label">전체 환자 · 위 스크롤=과거, 아래 스크롤=미래</p>
        </div>
        <div class="topbar-middle">
            <label class="search-wrapper">
                <span class="search-icon" aria-hidden="true">🔍</span>
                <input id="search-input" type="search"
                       placeholder="환자 이름 또는 전화번호 검색"
                       autocomplete="off"
                       aria-label="환자 이름 또는 전화번호 검색">
                <span class="search-result-count" id="search-result-count" hidden></span>
            </label>
        </div>
        <div class="topbar-right">
            <div class="clock" id="clock">--:--:--</div>
            <p class="last-refresh" id="last-refresh">갱신: -</p>
            <button class="btn-refresh" id="btn-refresh">↻ 새로고침</button>
            <button class="btn-today" id="btn-today" title="오늘로 이동">📅 오늘</button>
        </div>
    </header>

    <main>
        <div class="table-wrapper">
            <table class="appt-table">
                <thead>
                    <tr>
                        <th class="th-time">예약 시간</th>
                        <th class="th-name">환자 이름</th>
                        <th class="th-visit">방문 횟수</th>
                        <th class="th-symptoms">증상</th>
                    </tr>
                </thead>
                <tbody id="appt-body">
                    <tr><td colspan="4" class="loading">불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Manage modal — 3 actions (modify / soft delete / hard delete);
         "수정" switches the body to an inline edit form for patient + appt. -->
    <div class="modal-backdrop" id="manage-modal" hidden>
        <div class="modal-card modal-card-narrow" role="dialog" aria-labelledby="manage-modal-title">
            <header class="modal-header">
                <div>
                    <h2 id="manage-modal-title">환자 정보 관리</h2>
                    <p class="modal-subtitle" id="manage-modal-subtitle"></p>
                </div>
                <button class="modal-close" id="manage-modal-close" aria-label="닫기">✕</button>
            </header>

            <!-- View 1: 3-button choice -->
            <div class="modal-body" id="manage-view-choice">
                <p class="modal-question">이 예약을 어떻게 처리할까요?</p>
                <div class="delete-option">
                    <button type="button" class="btn-modify" id="btn-modify">✏️ 수정</button>
                    <p class="delete-option-desc">환자가 입력한 이름·전화·증상과 예약 날짜/시간을 의사가 직접 고칩니다.</p>
                </div>
                <div class="delete-option">
                    <button type="button" class="btn-delete-soft" id="btn-soft-delete">📦 보관 후 숨기기</button>
                    <p class="delete-option-desc">‘취소됨(cancelled)’으로 표시되어 화면에서만 사라집니다. DB엔 보존(감사·복구용).</p>
                </div>
                <div class="delete-option">
                    <button type="button" class="btn-delete-hard" id="btn-hard-delete">🗑 완전 삭제</button>
                    <p class="delete-option-desc">DB에서 영구 제거됩니다. <strong>복구 불가능</strong>.</p>
                </div>
                <p class="modal-error" id="manage-modal-error" hidden></p>
            </div>

            <!-- View 2: edit form (shown after pressing 수정) -->
            <div class="modal-body" id="manage-view-edit" hidden>
                <div class="form-group">
                    <label for="edit-name">이름</label>
                    <input id="edit-name" type="text" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="edit-phone">전화</label>
                    <input id="edit-phone" type="tel" inputmode="numeric" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="edit-symptoms">증상 (스페인어)</label>
                    <textarea id="edit-symptoms" rows="4"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-date">예약 날짜</label>
                        <input id="edit-date" type="date">
                    </div>
                    <div class="form-group">
                        <label for="edit-time">시간</label>
                        <input id="edit-time" type="time" step="60">
                    </div>
                </div>
                <p class="modal-error" id="manage-edit-error" hidden></p>
            </div>

            <footer class="modal-footer" id="manage-footer-choice">
                <button type="button" class="btn-cancel" id="btn-manage-cancel">취소</button>
            </footer>
            <footer class="modal-footer" id="manage-footer-edit" hidden>
                <button type="button" class="btn-cancel" id="btn-edit-back">← 뒤로</button>
                <button type="button" class="btn-translate" id="btn-edit-save">💾 저장</button>
            </footer>
        </div>
    </div>

    <!-- Symptom detail modal (full text + Korean translation toggle) -->
    <div class="modal-backdrop" id="symptom-modal" hidden>
        <div class="modal-card" role="dialog" aria-labelledby="symptom-modal-title">
            <header class="modal-header">
                <div>
                    <h2 id="symptom-modal-title">증상</h2>
                    <p class="modal-subtitle" id="symptom-modal-subtitle"></p>
                </div>
                <button class="modal-close" id="symptom-modal-close" aria-label="닫기">✕</button>
            </header>
            <div class="modal-body">
                <p class="modal-lang-label" id="symptom-modal-lang">스페인어 원문</p>
                <div class="modal-text" id="symptom-modal-text"></div>
                <p class="modal-error" id="symptom-modal-error" hidden></p>
            </div>
            <footer class="modal-footer">
                <button class="btn-translate" id="btn-translate">🌐 한글 번역</button>
            </footer>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script src="app.js"></script>
</body>
</html>
